[package]
name = "terminus"
version = "0.2.0"
description = "Multi-OS local terminal workspace"
authors = ["Terminus"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "terminus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri = { version = "2", features = ["macos-private-api"] }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tauri-plugin-dialog = "2"
git2 = "0.21"

[dev-dependencies]
tempfile = "3"
